<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a0f14" />
    <meta name="robots" content="noindex" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="stylesheet" href="/app.css" />
    <title>Smagninger · Vin-dagbog</title>
  </head>
  <body>
    <header class="topbar">
      <h1>🥂 Smagninger</h1>
      <a class="small" href="/">← Alle vine</a>
    </header>

    <div id="list"></div>

    <details class="card" id="newCard">
      <summary>+ Ny smagning</summary>
      <form id="form">
        <div id="formBox"></div>
        <div id="msg"></div>
        <button class="btn block" type="submit" style="margin-top: 14px">Opret smagning</button>
      </form>
    </details>

    <script src="/app.js"></script>
    <script src="/session.js"></script>
    <script src="/eventform.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);

      function flash(text) {
        let m = $("evMsg");
        if (!m) { m = el("div", { id: "evMsg" }); $("list").parentNode.insertBefore(m, $("list")); }
        m.innerHTML = "";
        m.appendChild(el("div", { class: "banner ok", text }));
      }

      // Which tastings have their wine list unfolded (per browser).
      let openSet = new Set();
      try { openSet = new Set(JSON.parse(localStorage.getItem("eventsOpen") || "[]")); } catch {}
      const saveOpen = () => { try { localStorage.setItem("eventsOpen", JSON.stringify([...openSet])); } catch {} };
      let toggles = [];

      async function load() {
        const box = $("list");
        box.innerHTML = "";
        toggles = [];
        const rows = await apiGet("/api/events?" + Session.q());
        const withWines = rows.filter((e) => (e.wine_list || []).length);
        if (withWines.length > 1) {
          const allOpen = () => withWines.every((e) => openSet.has(e.id));
          const btn = el("button", { type: "button", class: "linkbtn small", style: "margin:0 0 8px" });
          const drawAll = () => (btn.textContent = allOpen() ? "Fold alle vinlister ind ▴" : "Fold alle vinlister ud ▾");
          btn.onclick = () => {
            const open = !allOpen();
            withWines.forEach((e) => (open ? openSet.add(e.id) : openSet.delete(e.id)));
            saveOpen();
            toggles.forEach((d) => d());
            drawAll();
          };
          drawAll();
          box.appendChild(el("div", { style: "text-align:right" }, [btn]));
        }
        if (!rows.length) {
          box.appendChild(el("p", { class: "muted", text: "Ingen smagninger endnu — opret den første herunder." }));
          $("newCard").open = true;
        }
        for (const e of rows) {
          const count = e.planned_count ? e.wines + " / " + e.planned_count + " vine" : e.wines + " vine";
          const card = el("div", { class: "card event-card" }, [
            el("a", { class: "event-head", href: "/event?id=" + e.id }, [
              el("div", { style: "flex:1;min-width:0" }, [
                el("div", { style: "font-weight:700", text: e.title }),
                el("div", { class: "meta", text: "📅 " + eventWhen(e) + (e.place ? " · 📍 " + e.place : "") }),
                el("div", { class: "meta", text: eventKindText(e) }),
              ]),
              el("div", { class: "small muted", style: "text-align:right", text: count + " ›" }),
            ]),
          ]);
          // The tasting's wines, collapsible (state remembered per tasting in this browser).
          const wl = e.wine_list || [];
          const wineBox = el("div", { class: "event-wines" });
          if (wl.length) {
            const bought = wl.filter((w) => w.bought).length;
            const wanted = wl.filter((w) => !w.bought && w.in_list === 2).length;
            const toggle = el("button", { type: "button", class: "event-wines-toggle" });
            const draw = () => {
              const open = openSet.has(e.id);
              wineBox.hidden = !open;
              toggle.textContent = "🍷 " + wl.length + " vin" + (wl.length === 1 ? "" : "e") +
                (bought ? " · 🛒 " + bought + " købt" : "") + (wanted ? " · ⭐ " + wanted + " vil købe" : "") + (open ? "  ▾" : "  ▸");
              toggle.setAttribute("aria-expanded", String(open));
            };
            toggle.onclick = () => { openSet.has(e.id) ? openSet.delete(e.id) : openSet.add(e.id); saveOpen(); draw(); };
            toggles.push(draw);
            card.appendChild(toggle);
            card.appendChild(wineBox);
            draw();
          }
          for (const w of wl) {
            const label = [w.name, w.vintage].filter(Boolean).join(" ");
            wineBox.appendChild(el("div", { class: "event-wine-row" }, [
              w.color ? el("span", { class: "dot", style: "background:" + COLOR_DOTS[w.color] }) : el("span", { class: "dot", style: "opacity:0" }),
              el("a", { href: "/wine?id=" + w.wine_id, class: "ew-name", text: label }),
              w.avg_rating !== null ? el("span", { class: "stars small", text: stars(w.avg_rating) }) : null,
              buyWantButtons({ ...w, id: w.id }, (msg) => { flash(msg); load(); }),
            ]));
          }
          box.appendChild(card);
        }
      }

      function init() {
        const read = renderEventForm($("formBox"));
        $("form").addEventListener("submit", async (ev) => {
          ev.preventDefault();
          try {
            const { id } = await apiSend("/api/events", "POST", { cellarId: Session.cellarId, ...read() });
            location.href = "/event?id=" + id;
          } catch (err) {
            $("msg").innerHTML = "";
            $("msg").appendChild(el("div", { class: "banner err", text: err.message }));
          }
        });
        load();
      }
      Session.onReady(init);
    </script>
  </body>
</html>
