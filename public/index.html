<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a0f14" />
    <meta name="robots" content="noindex" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="stylesheet" href="/app.css" />
    <title>Vin-dagbog</title>
  </head>
  <body>
    <header class="topbar">
      <h1>🍷 Vin-dagbog</h1>
      <div class="small" style="text-align: right">
        <a href="/events">🥂 Smagninger</a><br />
        <a href="/storages">🗄️ Køleskabe & reoler</a><br />
        <a id="exportLink" href="#">Eksportér CSV</a>
      </div>
    </header>

    <div class="chips" id="kindChips"></div>
    <div class="chips src" id="srcChips"></div>

    <div class="toolbar">
      <input type="search" id="q" placeholder="Søg navn, producent, drue, område…" />
      <select id="fColor"><option value="">Alle typer</option></select>
      <select id="fCountry"><option value="">Alle lande</option></select>
      <select id="sort">
        <option value="new">Nyeste først</option>
        <option value="rating">Bedst bedømt</option>
        <option value="tasted">Senest smagt</option>
        <option value="vintage">Årgang</option>
        <option value="name">Navn A–Å</option>
      </select>
    </div>

    <div id="count" class="small muted" style="margin-bottom: 8px"></div>
    <div id="list"></div>

    <a class="fab" href="/add">📷 Ny vin</a>

    <script src="/app.js"></script>
    <script src="/session.js"></script>
    <script>
      let wines = [];
      const $ = (id) => document.getElementById(id);

      function fill(select, values) {
        for (const v of values) select.appendChild(el("option", { value: v, text: COLOR_LABELS[v] || v }));
      }

      // Quick filters: how the wine was met, then a dynamic "hvor fra" row built
      // from shop names, places and tastings (case-insensitive, most used first).
      const KIND_CHIPS = [["", "Alle"], ["kobt", KIND_NAMES.kobt], ["restaurant", KIND_NAMES.restaurant],
        ["smagning", KIND_NAMES.smagning], ["hjemme", KIND_NAMES.hjemme], ["lager", "📍 På lager"]];
      let selKind = "", selSrc = "", showAllSrc = false;
      try { selKind = localStorage.getItem("wineKind") || ""; selSrc = localStorage.getItem("wineSrc") || ""; } catch {}
      const matchKind = (w, k) => !k || (k === "lager" ? w.stored > 0 : w.kinds.includes(k));

      function chip(text, count, active, onclick) {
        return el("button", { type: "button", class: "chip" + (active ? " on" : ""), onclick },
          [text, count !== null ? el("span", { class: "n", text: String(count) }) : null]);
      }
      function remember() {
        try { localStorage.setItem("wineKind", selKind); localStorage.setItem("wineSrc", selSrc); } catch {}
      }
      function renderChips() {
        const kb = $("kindChips");
        kb.innerHTML = "";
        for (const [k, label] of KIND_CHIPS) {
          const n = k ? wines.filter((w) => matchKind(w, k)).length : wines.length;
          if (k && !n && selKind !== k) continue;
          kb.appendChild(chip(label, n, selKind === k, () => { selKind = selKind === k ? "" : k; selSrc = ""; remember(); render(); }));
        }
        const counts = new Map();
        for (const w of wines.filter((x) => matchKind(x, selKind))) {
          for (const src of new Set(w.sources.map((x) => x.toLowerCase()))) {
            const name = w.sources.find((x) => x.toLowerCase() === src);
            const c = counts.get(src) || { name, n: 0 };
            if (/^\p{Lu}/u.test(name) && !/^\p{Lu}/u.test(c.name)) c.name = name; // prefer "Vinbutikken" over "vinbutikken"
            c.n++;
            counts.set(src, c);
          }
        }
        if (selSrc && !counts.has(selSrc)) selSrc = "";
        const sb = $("srcChips");
        sb.innerHTML = "";
        const list = [...counts.entries()].sort((a, b) => b[1].n - a[1].n || a[1].name.localeCompare(b[1].name, "da"));
        if (!list.length) return;
        sb.appendChild(el("span", { class: "chips-label", text: "Hvor fra:" }));
        const shown = showAllSrc ? list : list.slice(0, 8);
        if (selSrc && !shown.some(([k]) => k === selSrc)) shown.push(list.find(([k]) => k === selSrc));
        for (const [key, c] of shown) {
          sb.appendChild(chip(c.name, c.n, selSrc === key, () => { selSrc = selSrc === key ? "" : key; remember(); render(); }));
        }
        if (list.length > 8) {
          sb.appendChild(el("button", { type: "button", class: "chip more", text: showAllSrc ? "Færre" : "+" + (list.length - 8) + " flere",
            onclick: () => { showAllSrc = !showAllSrc; renderChips(); } }));
        }
      }

      function render() {
        renderChips();
        const q = $("q").value.trim().toLowerCase();
        const color = $("fColor").value, country = $("fCountry").value;
        let rows = wines.filter((w) => {
          if (color && w.color !== color) return false;
          if (country && w.country !== country) return false;
          if (!matchKind(w, selKind)) return false;
          if (selSrc && !w.sources.some((x) => x.toLowerCase() === selSrc)) return false;
          if (q) {
            const hay = [w.name, w.producer, w.grapes, w.region, w.country, w.appellation, w.vintage].join(" ").toLowerCase();
            if (!q.split(/\s+/).every((t) => hay.includes(t))) return false;
          }
          return true;
        });
        const sort = $("sort").value;
        const by = {
          new: (a, b) => b.id - a.id,
          rating: (a, b) => (b.avg_rating ?? -1) - (a.avg_rating ?? -1),
          tasted: (a, b) => String(b.last_tasted || "").localeCompare(String(a.last_tasted || "")),
          vintage: (a, b) => (b.vintage ?? 0) - (a.vintage ?? 0),
          name: (a, b) => a.name.localeCompare(b.name, "da"),
        }[sort];
        rows = rows.sort(by);

        $("count").textContent = rows.length + " af " + wines.length + " vine";
        const box = $("list");
        box.innerHTML = "";
        if (!wines.length) {
          box.appendChild(el("div", { class: "card center" }, [
            el("p", { text: "Ingen vine endnu." }),
            el("a", { class: "btn", href: "/add", text: "📷 Tag et billede af din første flaske" }),
          ]));
          return;
        }
        for (const w of rows) {
          const thumb = w.cover_id
            ? el("img", { class: "thumb", src: "/api/photos/" + w.cover_id + "?size=thumb", alt: "", loading: "lazy" })
            : el("div", { class: "thumb", text: "🍷" });
          const meta = [w.producer, w.vintage, w.region || w.country].filter(Boolean).join(" · ");
          box.appendChild(el("a", { class: "wine-item", href: "/wine?id=" + w.id }, [
            thumb,
            el("div", { class: "info" }, [
              el("div", { class: "title" }, [w.color ? el("span", { class: "dot", style: "background:" + COLOR_DOTS[w.color] }) : null, w.name]),
              el("div", { class: "meta", text: meta }),
              w.grapes ? el("div", { class: "meta", text: w.grapes }) : null,
            ]),
            el("div", { class: "right" }, [
              w.avg_rating !== null ? el("div", { class: "stars", text: stars(w.avg_rating) }) : el("div", { class: "muted", text: "ikke bedømt" }),
              w.stored ? el("div", { class: "badge", text: "📍 " + w.stored + " på lager" }) : null,
              w.bought ? el("div", { class: "badge", text: "Købt " + w.bought + (w.last_price !== null ? " · " + money(w.last_price, w.last_currency) : "") }) : null,
            ]),
          ]));
        }
      }

      async function load() {
        $("exportLink").href = "/api/export.csv?" + Session.q();
        wines = await apiGet("/api/wines?" + Session.q());
        fill($("fColor"), [...new Set(wines.map((w) => w.color).filter(Boolean))]);
        fill($("fCountry"), [...new Set(wines.map((w) => w.country).filter(Boolean))].sort((a, b) => a.localeCompare(b, "da")));
        for (const id of ["q", "fColor", "fCountry", "sort"]) $(id).addEventListener("input", render);
        render();
      }

      Session.onReady(load);
    </script>
  </body>
</html>
